<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohan Thapliyal - Reading Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="experience.html">Experience</a>
            <a href="projects.html">Projects</a>
            <a href="skills.html">Skills</a>
            <a href="books.html" class="active">Books</a>
        </div>
        <!-- Dark Mode Toggle Button -->
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
            🌙
        </button>
    </nav>
    
    <div class="container">
        <h2>Currently Reading</h2>
        <p class="subtitle" id="journal-subtitle">Fetching latest entries from Goodreads...</p>
        
        <div style="overflow-x: auto;">
            <table id="books-table">
                <thead>
                    <tr>
                        <th>Book</th>
                        <th>Author</th>
                        <th>Added On</th>
                    </tr>
                </thead>
                <tbody id="books-tbody">
                    <!-- Populated dynamically via RSS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Sync Theme Preference across pages
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const themeToggle = document.getElementById('theme-toggle');
            
            if (themeToggle) {
                themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

                themeToggle.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
                });
            }

            // 2. Fetch and Parse Goodreads RSS feed
            fetchGoodreadsFeed();
        });

        async function fetchGoodreadsFeed() {
            const subtitle = document.getElementById('journal-subtitle');
            const tbody = document.getElementById('books-tbody');
            
            // Numeric user ID only (stripping the slug)
            const numericUserId = '205131058'; 
            const rssUrl = `https://www.goodreads.com/review/list_rss/${numericUserId}?shelf=currently-reading`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                if (!data || !data.contents) throw new Error('No content returned from proxy');

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, 'text/xml');
                const items = xmlDoc.querySelectorAll('item');

                if (!items || items.length === 0) {
                    if (subtitle) subtitle.textContent = 'No books currently being read found on Goodreads.';
                    return;
                }

                if (subtitle) {
                    subtitle.textContent = `Showing ${items.length} book(s) currently reading on Goodreads`;
                }

                if (!tbody) return;
                tbody.innerHTML = '';

                items.forEach(item => {
                    const title = item.querySelector('title')?.textContent || 'Untitled';
                    const link = item.querySelector('link')?.textContent || item.querySelector('guid')?.textContent || '#';
                    const author = item.querySelector('author_name')?.textContent || 'Unknown Author';
                    const pubDate = item.querySelector('pubDate')?.textContent || '';
                    
                    // Format date (YYYY-MM-DD)
                    let addedDate = '—';
                    if (pubDate) {
                        const d = new Date(pubDate);
                        if (!isNaN(d)) addedDate = d.toISOString().split('T')[0];
                    }

                    const tr = document.createElement('tr');

                    // Book Title
                    const titleTd = document.createElement('td');
                    const a = document.createElement('a');
                    a.href = link;
                    a.textContent = title;
                    a.target = '_blank';
                    a.className = 'github-link';
                    a.style.marginLeft = '0';
                    titleTd.appendChild(a);

                    // Author
                    const authorTd = document.createElement('td');
                    authorTd.textContent = author;

                    // Added Date
                    const dateTd = document.createElement('td');
                    dateTd.textContent = addedDate;

                    tr.appendChild(titleTd);
                    tr.appendChild(authorTd);
                    tr.appendChild(dateTd);
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error('Error fetching Goodreads feed:', error);
                if (subtitle) subtitle.textContent = 'Failed to load Goodreads entries. Check console for details.';
            }
        }
    </script>
</body>
</html>
